<!DOCTYPE html>
<html>

<head>
    <title>College Bus Tracker</title>

    <style>
        body {
            font-size: 20px;
        }

        table {
            font-size: 24px;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border: 2px solid black;
        }

        input {
            font-size: 20px;
            padding: 8px;
            width: 180px;
            box-sizing: border-box;
        }

        button {
            font-size: 20px;
            padding: 10px;
            margin: 10px 5px;
        }
    </style>
</head>

<body>

    <h1>🚌 College Bus Tracker</h1>

    <p>Welcome to my college bus tracker!</p>

    <table id="busTable">

        <tr>
            <th>Starting Place</th>
            <th>Time</th>
            <th>Bus Stops</th>
            <th>Notes</th>
        </tr>

        <tr>
            <td>
                <input type="text" value="Your Place">
            </td>

            <td>
                <input type="text" value="6:30 AM">
            </td>

            <td>
                <input type="text" value="Stop 1, Stop 2">
            </td>

            <td>
                <input type="text" value="Morning bus">
            </td>
        </tr>

    </table>

    <br>

    <button onclick="addRow()">➕ Add Row</button>

    <button onclick="addColumn()">➕ Add Column</button>
    <button onclick="saveTable()">💾 Save Changes</button>


    <script>

        function addRow() {

            var table = document.getElementById("busTable");

            var row = table.insertRow();

            var cell1 = row.insertCell(0);
            var cell2 = row.insertCell(1);
            var cell3 = row.insertCell(2);
            var cell4 = row.insertCell(3);

            cell1.innerHTML =
                '<input type="text" placeholder="Enter place">';

            cell2.innerHTML =
                '<input type="text" placeholder="Enter time">';

            cell3.innerHTML =
                '<input type="text" placeholder="Enter bus stop">';

            cell4.innerHTML =
                '<input type="text" placeholder="Enter notes">';
        }


        function addColumn() {

            var name = prompt("Enter column name:");

            if (name == null || name == "") {
                return;
            }

            var table = document.getElementById("busTable");

            var header = table.rows[0].insertCell(-1);

            header.innerHTML = name;

            for (var i = 1; i < table.rows.length; i++) {

                var cell = table.rows[i].insertCell(-1);

                cell.innerHTML =
                    '<input type="text" placeholder="Enter ' + name + '">';
            }
        }

    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://nmzbitljukawlkhxnrlf.supabase.co";

const supabaseKey = "sb_publishable_ZiAF771-GgJMzToVMdsDIg_-ag7jxAw";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);
    <script>
async function saveTable() {

    var table = document.querySelector("table");
    var tableData = [];

    for (var i = 0; i < table.rows.length; i++) {

        var rowData = [];

        for (var j = 0; j < table.rows[i].cells.length; j++) {
            rowData.push(table.rows[i].cells[j].innerText);
        }

        tableData.push(rowData);
    }

    const { error } = await supabase
        .from("bus_data")
        .insert({
            data: tableData
        });

    if (error) {
        alert("❌ Save failed: " + error.message);
    } else {
        alert("✅ Bus data saved!");
    }
}
</script>

</body>
</html>
