<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Bus Tracker</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: white;
            color: black;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 2px solid #333;
            padding: 0;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f2f2f2;
            font-size: 20px;
            padding: 12px;
        }

        td {
            min-height: 55px;
            font-size: 18px;
        }

        /* The editable area */
        td[contenteditable="true"] {
            padding: 14px;
            min-height: 55px;
            outline: none;

            /* Allow long words/text */
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        td[contenteditable="true"]:focus {
            background: #fffde7;
        }

        button {
            font-size: 18px;
            padding: 12px 18px;
            margin: 15px 8px 0 0;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 17px;
            }

            th {
                font-size: 17px;
                padding: 10px;
            }

            td {
                font-size: 17px;
            }

            td[contenteditable="true"] {
                padding: 12px 8px;
            }

            button {
                font-size: 17px;
                padding: 10px 14px;
            }
        }
    </style>
</head>

<body>

    <h1>🚌 College Bus Tracker</h1>

    <p>Welcome to my college bus tracker!</p>

    <div class="table-container">

        <table id="busTable">

            <thead>
                <tr>
                    <th>Starting Place</th>
                    <th>Time</th>
                    <th>Bus Stops</th>
                    <th>Notes</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td contenteditable="true">Your Place</td>
                    <td contenteditable="true">6:30 AM</td>
                    <td contenteditable="true">Stop 1, Stop 2</td>
                    <td contenteditable="true">Morning bus</td>
                </tr>

            </tbody>

        </table>

    </div>

    <button onclick="addRow()">➕ Add Row</button>

    <button onclick="addColumn()">➕ Add Column</button>

    <button onclick="saveData()">💾 Save Changes</button>

    <div id="message"></div>


    <script>

        // ==========================================
        // SUPABASE SETTINGS
        // ==========================================

        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        // ==========================================
        // ADD ROW
        // ==========================================

        function addRow() {

            const table = document.getElementById("busTable");

            const tbody = table.querySelector("tbody");

            const columnCount = table.rows[0].cells.length;

            const row = document.createElement("tr");

            for (let i = 0; i < columnCount; i++) {

                const cell = document.createElement("td");

                cell.contentEditable = "true";

                cell.innerText = "";

                row.appendChild(cell);
            }

            tbody.appendChild(row);
        }


        // ==========================================
        // ADD COLUMN
        // ==========================================

        function addColumn() {

            const table = document.getElementById("busTable");

            const headerRow = table.querySelector("thead tr");

            const newHeader = document.createElement("th");

            newHeader.innerText = "New Column";

            headerRow.appendChild(newHeader);


            const rows = table.querySelectorAll("tbody tr");

            rows.forEach(function(row) {

                const cell = document.createElement("td");

                cell.contentEditable = "true";

                cell.innerText = "";

                row.appendChild(cell);

            });
        }


        // ==========================================
        // GET TABLE DATA
        // ==========================================

        function getTableData() {

            const table = document.getElementById("busTable");

            const headers = [];

            const headerCells = table.querySelectorAll("thead th");

            headerCells.forEach(function(cell) {

                headers.push(cell.innerText.trim());

            });


            const rows = [];

            const bodyRows = table.querySelectorAll("tbody tr");

            bodyRows.forEach(function(row) {

                const rowData = [];

                row.querySelectorAll("td").forEach(function(cell) {

                    rowData.push(cell.innerText.trim());

                });

                rows.push(rowData);

            });


            return {
                headers: headers,
                rows: rows
            };
        }


        // ==========================================
        // SAVE DATA TO SUPABASE
        // ==========================================

        async function saveData() {

            const message = document.getElementById("message");

            message.innerText = "⏳ Saving...";

            const tableData = getTableData();


            try {

                // Remove old saved data
                const { error: deleteError } =
                    await supabaseClient
                        .from("bus_data")
                        .delete()
                        .neq("id", 0);


                if (deleteError) {

                    console.error(deleteError);

                    message.innerText =
                        "❌ Delete error: " + deleteError.message;

                    return;
                }


                // Save new data
                const { error: insertError } =
                    await supabaseClient
                        .from("bus_data")
                        .insert([
                            {
                                data: tableData
                            }
                        ]);


                if (insertError) {

                    console.error(insertError);

                    message.innerText =
                        "❌ Save error: " + insertError.message;

                    return;
                }


                message.innerText =
                    "✅ Bus data saved successfully!";


            } catch (error) {

                console.error(error);

                message.innerText =
                    "❌ Something went wrong.";

            }

        }


        // ==========================================
        // LOAD DATA FROM SUPABASE
        // ==========================================

        async function loadData() {

            const message = document.getElementById("message");


            try {

                const { data, error } =
                    await supabaseClient
                        .from("bus_data")
                        .select("*")
                        .order("id", { ascending: false })
                        .limit(1);


                if (error) {

                    console.error(error);

                    message.innerText =
                        "❌ Load error: " + error.message;

                    return;
                }


                if (!data || data.length === 0) {

                    message.innerText =
                        "ℹ️ No saved bus data yet.";

                    return;
                }


                const savedData = data[0].data;


                if (!savedData) {

                    message.innerText =
                        "ℹ️ No data found.";

                    return;
                }


                const table =
                    document.getElementById("busTable");


                // -------------------------------
                // Restore headers
                // -------------------------------

                const headerRow =
                    table.querySelector("thead tr");

                headerRow.innerHTML = "";


                savedData.headers.forEach(function(header) {

                    const th = document.createElement("th");

                    th.innerText = header;

                    headerRow.appendChild(th);

                });


                // -------------------------------
                // Restore body
                // -------------------------------

                const tbody =
                    table.querySelector("tbody");

                tbody.innerHTML = "";


                savedData.rows.forEach(function(rowData) {

                    const row = document.createElement("tr");


                    rowData.forEach(function(value) {

                        const cell =
                            document.createElement("td");

                        cell.contentEditable = "true";

                        cell.innerText = value;

                        row.appendChild(cell);

                    });


                    tbody.appendChild(row);

                });


                message.innerText =
                    "✅ Saved bus data loaded!";


            } catch (error) {

                console.error(error);

                message.innerText =
                    "❌ Could not load data.";

            }

        }


        // ==========================================
        // LOAD WHEN WEBSITE OPENS
        // ==========================================

        window.addEventListener("load", function() {

            loadData();

        });

    </script>

</body>
    </html>
